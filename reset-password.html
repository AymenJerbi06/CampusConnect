<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New password — CampusConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="cc-page">
    <div class="cc-page-inner no-tab">
      <div class="cc-auth-page animate-slide-up">

        <div class="cc-auth-logo">
          <a href="/" class="cc-header-logo">
            <div class="cc-logo-mark">CC</div>
            <span>CampusConnect</span>
          </a>
        </div>

        <div style="margin-bottom:28px;margin-top:20px;">
          <h1 class="cc-auth-title">Enter your reset code</h1>
          <p class="cc-auth-subtitle" id="emailDisplay">Check your email for the 6-digit reset code.</p>
        </div>

        <div class="cc-error-msg" id="errorMsg"></div>

        <!-- OTP input -->
        <div class="cc-field">
          <label class="cc-label">Reset code</label>
          <div class="cc-otp-inputs" id="otpInputs">
            <input type="text" inputmode="numeric" maxlength="1" class="cc-otp-digit" />
            <input type="text" inputmode="numeric" maxlength="1" class="cc-otp-digit" />
            <input type="text" inputmode="numeric" maxlength="1" class="cc-otp-digit" />
            <input type="text" inputmode="numeric" maxlength="1" class="cc-otp-digit" />
            <input type="text" inputmode="numeric" maxlength="1" class="cc-otp-digit" />
            <input type="text" inputmode="numeric" maxlength="1" class="cc-otp-digit" />
          </div>
        </div>

        <!-- New password -->
        <div class="cc-field">
          <label class="cc-label" for="pwInput">New Password <span style="color:var(--muted);font-size:12px;">(min 8 characters)</span></label>
          <div style="position:relative;">
            <input type="password" class="cc-input" id="pwInput" placeholder="Create a new password"
              autocomplete="new-password" style="padding-right:44px;" />
            <button type="button" id="togglePw" aria-label="Show password"
              style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button class="cc-btn" id="resetBtn" disabled>
          <span id="resetBtnText">Reset password</span>
        </button>

        <div class="cc-auth-footer">
          <a href="/login.html">&larr; Back to login</a>
        </div>

      </div>
    </div>
  </div>

  <script>
    const email   = sessionStorage.getItem('cc_email') || '';
    if (!email) window.location.href = '/forgot-password.html';

    document.getElementById('emailDisplay').textContent =
      `Check your email for the 6-digit reset code sent to ${email}`;

    const pwInput  = document.getElementById('pwInput');
    const resetBtn = document.getElementById('resetBtn');
    const errorMsg = document.getElementById('errorMsg');
    const digits   = Array.from(document.querySelectorAll('.cc-otp-digit'));

    digits.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/\D/g, '');
        input.value = val.slice(-1);
        if (val && idx < digits.length - 1) digits[idx + 1].focus();
        input.classList.toggle('filled', !!input.value);
        validate();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && idx > 0) {
          digits[idx - 1].focus(); digits[idx - 1].value = ''; digits[idx - 1].classList.remove('filled');
          validate();
        }
      });
      input.addEventListener('paste', (e) => {
        const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
        if (text.length === 6) {
          e.preventDefault();
          digits.forEach((d, i) => { d.value = text[i] || ''; d.classList.toggle('filled', !!d.value); });
          digits[5].focus(); validate();
        }
      });
    });

    function getCode() { return digits.map(d => d.value).join(''); }
    function validate() {
      resetBtn.disabled = getCode().length !== 6 || pwInput.value.length < 8;
    }

    pwInput.addEventListener('input', validate);
    pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') resetBtn.click(); });

    resetBtn.addEventListener('click', async () => {
      const code     = getCode();
      const password = pwInput.value;
      errorMsg.classList.remove('show');
      resetBtn.disabled = true;
      document.getElementById('resetBtnText').textContent = 'Resetting…';

      try {
        const res  = await fetch('/api/auth/reset-password', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, code, password }),
        });
        const data = await res.json();

        if (res.ok && data.success) {
          sessionStorage.removeItem('cc_email');
          sessionStorage.removeItem('cc_flow');
          window.location.href = data.redirect || '/home.html';
        } else {
          errorMsg.textContent = data.message || 'Failed. Please try again.';
          errorMsg.classList.add('show');
          digits.forEach(d => { d.value = ''; d.classList.remove('filled'); });
          digits[0].focus();
        }
      } catch (e) {
        errorMsg.textContent = 'Network error. Please try again.';
        errorMsg.classList.add('show');
      } finally {
        resetBtn.disabled = false;
        document.getElementById('resetBtnText').textContent = 'Reset password';
        validate();
      }
    });

    digits[0].focus();
  </script>
</body>
</html>
