<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community — CampusConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="cc-page">

    <!-- Header -->
    <header class="cc-header">
      <button class="cc-back-btn" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Back
      </button>
      <div class="cc-header-actions">
        <a href="/my-profile.html" style="display:flex;align-items:center;">
          <div class="cc-avatar" id="headerAvatar" style="width:32px;height:32px;font-size:13px;border-color:var(--border);">?</div>
        </a>
      </div>
    </header>

    <div class="cc-page-inner" style="overflow-y:auto; padding-bottom:80px;" id="pageContent">
      <div style="padding:32px;text-align:center;color:var(--muted);">Loading…</div>
    </div>

    <!-- Bottom Tab Bar -->
    <nav class="cc-tab-bar">
      <a href="/home.html" class="cc-tab-item" aria-label="Explore">
        <span class="cc-nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <span>Explore</span>
      </a>
      <a href="/inbox.html" class="cc-tab-item" aria-label="Friends">
        <span class="cc-nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="23" y1="11" x2="17" y2="11"/><line x1="20" y1="8" x2="20" y2="14"/></svg>
          <span class="cc-nav-badge" id="friendsBadge" style="display:none;"></span>
        </span>
        <span>Friends</span>
      </a>
      <a href="/study.html" class="cc-tab-item" aria-label="Study">
        <span class="cc-nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </span>
        <span>Study</span>
      </a>
      <a href="/messages.html" class="cc-tab-item" aria-label="Messages">
        <span class="cc-nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="cc-nav-badge" id="messagesBadge" style="display:none;"></span>
        </span>
        <span>Messages</span>
      </a>
      <a href="/my-profile.html" class="cc-tab-item" aria-label="Profile">
        <span class="cc-nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/presence.js"></script>
  <script src="/js/badges.js"></script>
  <script>
    // Auth guard
    (async () => {
      const res  = await fetch('/api/auth/me', { credentials: 'include' });
      const data = await res.json();
      if (!data.authenticated) { window.location.href = '/'; return; }
      refreshBadges();
      const initial = (data.user.name || data.user.email || '?')[0].toUpperCase();
      const av = document.getElementById('headerAvatar');
      if (data.user.photo_url) {
        av.innerHTML = `<img src="${data.user.photo_url}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;position:absolute;inset:0;" />`;
      } else {
        av.textContent = initial;
      }
    })();

    const id      = new URLSearchParams(window.location.search).get('id');
    if (!id) window.location.href = '/home.html';

    const content = document.getElementById('pageContent');
    let community = null;
    let selectedMajor = '';

    async function loadCommunity(major = '') {
      const params = major ? `?major=${encodeURIComponent(major)}` : '';
      try {
        const res = await fetch(`/api/communities/${id}${params}`, { credentials: 'include' });
        if (!res.ok) { window.location.href = '/home.html'; return; }
        const data = await res.json();
        community = data;
        renderPage(data);
      } catch (e) {
        content.innerHTML = '<div style="padding:32px;text-align:center;color:var(--muted);">Failed to load community.</div>';
      }
    }

    function renderPage(data) {
      // Get unique majors from members
      const majors = [...new Set(data.members.map(m => m.major).filter(Boolean))].sort();

      content.innerHTML = `
        <!-- Hero -->
        <div style="padding:28px 16px 16px;text-align:center;border-bottom:1px solid var(--border);" class="animate-slide-up">
          <div style="font-size:56px;line-height:1;margin-bottom:12px;">${data.flag_emoji}</div>
          <h1 style="font-family:var(--font-head);font-weight:800;font-size:22px;color:var(--text);margin-bottom:6px;line-height:1.2;">${data.name}</h1>
          <p style="font-size:14px;color:var(--muted);">${data.region}</p>
        </div>

        <!-- Stats -->
        <div class="cc-stat-row" style="padding:14px 16px 0;justify-content:center;gap:10px;">
          <div class="cc-stat-tag">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            ${data.member_count} member${data.member_count != 1 ? 's' : ''}
          </div>
          <div class="cc-stat-tag">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/></svg>
            ${majors.length} major${majors.length != 1 ? 's' : ''}
          </div>
        </div>

        <!-- Stripe accent -->
        <div style="height:3px;background:${data.color_hex};margin:16px 16px 0;border-radius:2px;opacity:0.6;"></div>

        <!-- Major filter pills -->
        ${majors.length > 1 ? `
        <div class="cc-pills-row" id="majorFilterPills">
          <button class="cc-pill active" data-major="">All</button>
          ${majors.map(m => `<button class="cc-pill" data-major="${m}">${m}</button>`).join('')}
        </div>` : '<div style="height:12px;"></div>'}

        <!-- Members section title -->
        <p class="cc-section-title">Members</p>

        <!-- Grid -->
        <div class="cc-grid-2" id="membersGrid"></div>

        ${data.members.length === 0 ? `
        <div style="padding:40px 24px;text-align:center;color:var(--muted);">
          <div style="font-size:32px;margin-bottom:8px;">👋</div>
          <p style="font-size:14px;">No visible members yet.</p>
        </div>` : ''}
      `;

      renderMembers(data.members);

      // Major filter pill listeners
      document.querySelectorAll('#majorFilterPills .cc-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          document.querySelectorAll('#majorFilterPills .cc-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          selectedMajor = pill.dataset.major;
          loadCommunity(selectedMajor);
        });
      });
    }

    function renderMembers(members) {
      const grid = document.getElementById('membersGrid');
      if (!grid) return;
      grid.innerHTML = '';
      members.forEach(u => {
        const card    = document.createElement('a');
        card.href     = `/profile.html?id=${u.id}`;
        card.className = 'cc-card cc-student-card';
        card.dataset.userId = u.id;
        const initial  = (u.name || '?')[0].toUpperCase();
        const photoHtml = u.photo_url
          ? `<img src="${u.photo_url}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" />`
          : '';
        const gender = (u.gender && u.gender !== 'Prefer not to say') ? u.gender : '';
        const presenceDot = (u.is_online !== null && u.is_online !== undefined)
          ? `<span class="cc-presence-dot ${u.is_online ? 'online' : 'offline'}"></span>`
          : '';
        card.innerHTML = `
          <div class="cc-avatar-wrap">
            <div class="cc-avatar">${initial}${photoHtml}</div>
            ${presenceDot}
          </div>
          <div class="cc-student-card-name">${u.name || 'Student'}</div>
          <div class="cc-student-card-meta">${[u.major, u.year].filter(Boolean).join(' · ')}</div>
          ${gender ? `<div class="cc-student-card-gender">${gender}</div>` : ''}
        `;
        grid.appendChild(card);
      });
    }

    loadCommunity();

    // Real-time presence updates for visible member cards
    try {
      const socket = io({ withCredentials: true });
      socket.on('presence:change', ({ userId, online }) => {
        document.querySelectorAll(`[data-user-id="${userId}"] .cc-presence-dot`).forEach(dot => {
          dot.className = `cc-presence-dot ${online ? 'online' : 'offline'}`;
        });
      });
    } catch (e) {}
  </script>
</body>
</html>
