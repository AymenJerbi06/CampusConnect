<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study — CampusConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .tab-panels > div { display: none; }
    .tab-panels > div.active { display: block; }
  </style>
</head>
<body>
  <div class="cc-page">

    <!-- Header -->
    <header class="cc-header">
      <div class="cc-header-logo" id="headerLogo">
        <div class="cc-logo-mark">CC</div>
        <span>Study</span>
        <span id="studyCampusLabel" style="display:none;font-size:11px;font-weight:700;color:var(--accent);background:rgba(200,168,64,.12);border:1px solid rgba(200,168,64,.3);border-radius:50px;padding:3px 9px;margin-left:6px;"></span>
      </div>
      <div class="cc-header-actions">
        <a href="/my-profile.html" style="display:flex;align-items:center;">
          <div class="cc-avatar" id="headerAvatar" style="width:32px;height:32px;font-size:13px;border-color:var(--border);position:relative;">?</div>
        </a>
      </div>
    </header>

    <!-- Inner tabs -->
    <div class="cc-inner-tabs">
      <button class="cc-inner-tab active" data-tab="ratings">Professor Ratings</button>
      <button class="cc-inner-tab" data-tab="groups">Study Groups</button>
    </div>

    <div class="cc-page-inner" style="overflow-y:auto; padding-bottom:calc(64px + 16px);" id="scrollArea">
      <div class="tab-panels">

        <!-- PROFESSOR RATINGS -->
        <div id="panel-ratings" class="active">

          <!-- View A: Faculties list -->
          <div id="viewDepts">
            <p class="cc-section-title">Faculties</p>
            <div id="deptList" style="padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;">
              <div class="cc-skeleton" style="height:72px;border-radius:16px;"></div>
              <div class="cc-skeleton" style="height:72px;border-radius:16px;"></div>
              <div class="cc-skeleton" style="height:72px;border-radius:16px;"></div>
            </div>
          </div>

          <!-- View B: Professors inside a department -->
          <div id="viewProfs" style="display:none;">

            <!-- Back + department heading -->
            <div style="padding:14px 16px 4px;display:flex;align-items:center;gap:10px;">
              <button class="cc-back-link" id="backToDeptsBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                All Faculties
              </button>
            </div>
            <div style="padding:2px 16px 12px;">
              <h2 id="deptTitle" style="font-family:var(--font-head);font-weight:800;font-size:20px;color:var(--text);margin:0;"></h2>
            </div>

            <!-- Rate a professor CTA -->
            <div style="padding:0 16px 12px;">
              <button class="cc-btn" id="rateProfBtn" style="width:100%;">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;stroke:#0a0a0f;">
                  <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
                </svg>
                Rate a professor
              </button>
            </div>

            <!-- Search within this department -->
            <div style="padding:0 16px 4px;">
              <div class="cc-search-input-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="search" class="cc-input" id="profSearchInput" placeholder="Search professors…" />
              </div>
            </div>

            <p class="cc-section-title" id="profListTitle">Professors</p>
            <div id="profList" style="padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;"></div>
          </div>

        </div>

        <!-- STUDY GROUPS -->
        <div id="panel-groups">
          <div class="cc-coming-soon-banner">
            <div style="font-size:40px;margin-bottom:12px;">📚</div>
            <p style="font-weight:800;font-size:16px;color:var(--text);margin-bottom:6px;">Study Groups</p>
            <p style="font-size:13px;color:var(--muted);line-height:1.5;">Create and join study groups for your courses.<br>Coming soon.</p>
          </div>
        </div>

      </div>
    </div>

    <!-- Bottom Tab Bar -->
    <nav class="cc-tab-bar">
      <a href="/home.html" class="cc-tab-item" aria-label="Explore">
        <span class="cc-nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <span>Explore</span>
      </a>
      <a href="/inbox.html" class="cc-tab-item" aria-label="Friends">
        <span class="cc-nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="23" y1="11" x2="17" y2="11"/><line x1="20" y1="8" x2="20" y2="14"/></svg>
          <span class="cc-nav-badge" id="friendsBadge" style="display:none;"></span>
        </span>
        <span>Friends</span>
      </a>
      <a href="/study.html" class="cc-tab-item active" aria-label="Study">
        <span class="cc-nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </span>
        <span>Study</span>
      </a>
      <a href="/messages.html" class="cc-tab-item" aria-label="Messages">
        <span class="cc-nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="cc-nav-badge" id="messagesBadge" style="display:none;"></span>
        </span>
        <span>Messages</span>
      </a>
      <a href="/my-profile.html" class="cc-tab-item" aria-label="Profile">
        <span class="cc-nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <!-- ── Rate a Professor sheet ── -->
  <div class="cc-sheet-overlay" id="rateSheet">
    <div class="cc-sheet">
      <div class="cc-sheet-handle"></div>
      <div class="cc-sheet-title">Rate a Professor</div>

      <!-- Department badge (shown when pre-filled from dept view) -->
      <div id="sheetDeptBadge" style="display:none;margin-bottom:12px;">
        <span class="cc-interest-tag" style="font-size:12px;">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13" style="stroke:var(--accent);"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/></svg>
          <span id="sheetDeptLabel"></span>
        </span>
      </div>

      <!-- Step 1: find or create professor -->
      <div id="stepSearch">
        <div class="cc-field">
          <label class="cc-label">Professor Name <span style="color:var(--accent)">*</span></label>
          <div class="cc-search-input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" class="cc-input" id="sheetProfSearch" placeholder="Search or type full name…" autocomplete="off" />
          </div>
        </div>
        <div id="sheetSearchResults" style="display:flex;flex-direction:column;gap:8px;margin-top:4px;"></div>
        <button class="cc-btn" id="sheetNextBtn" style="width:100%;margin-top:12px;">Continue</button>
      </div>

      <!-- Step 2: write the review -->
      <div id="stepReview" style="display:none;">
        <div id="selectedProfBanner" style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 14px;margin-bottom:16px;font-weight:700;font-size:14px;color:var(--text);"></div>

        <div class="cc-field">
          <label class="cc-label">Course Code <span style="color:var(--accent)">*</span></label>
          <input type="text" class="cc-input" id="reviewCourse" placeholder="e.g. CMPT 120" maxlength="20" style="text-transform:uppercase;" />
        </div>

        <div class="cc-field">
          <label class="cc-label">Rating <span style="color:var(--accent)">*</span></label>
          <div class="cc-stars" id="starPicker" style="gap:8px;padding:4px 0;">
            <svg class="cc-star" data-v="1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <svg class="cc-star" data-v="2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <svg class="cc-star" data-v="3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <svg class="cc-star" data-v="4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <svg class="cc-star" data-v="5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
          <div id="ratingLabel" style="font-size:12px;color:var(--muted);margin-top:4px;height:16px;"></div>
        </div>

        <div class="cc-field">
          <label class="cc-label">Comment <span style="font-size:11px;color:var(--muted);">(optional)</span></label>
          <textarea class="cc-input cc-textarea" id="reviewComment" placeholder="Share your experience…" maxlength="1000" rows="4"></textarea>
          <div class="cc-char-count"><span id="commentCount">0</span>/1000</div>
        </div>

        <div class="cc-field">
          <label class="cc-label">Grade Received <span style="font-size:11px;color:var(--muted);">(optional)</span></label>
          <select class="cc-select" id="reviewGrade">
            <option value="">Prefer not to say</option>
            <option>A+</option><option>A</option><option>A-</option>
            <option>B+</option><option>B</option><option>B-</option>
            <option>C+</option><option>C</option><option>C-</option>
            <option>D</option><option>F</option>
          </select>
        </div>

        <div class="cc-error-msg" id="reviewError"></div>
        <div style="display:flex;gap:10px;">
          <button class="cc-btn cc-btn-ghost" id="reviewBackBtn" style="flex:1;">Back</button>
          <button class="cc-btn" id="submitReviewBtn" style="flex:2;"><span id="submitReviewText">Submit review</span></button>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/presence.js"></script>
  <script src="/js/badges.js"></script>
  <script>
    // ── Shared state ──────────────────────────────────────────────────────────
    let currentUser  = null;
    let selectedDept = null; // { id, name } | null — the currently open department

    // Read campus selection from sessionStorage (set by home.html campus switcher)
    const selectedUniId = parseInt(sessionStorage.getItem('cc_selectedUniId')) || null;

    // ── Auth guard ────────────────────────────────────────────────────────────
    (async () => {
      const res  = await fetch('/api/auth/me', { credentials: 'include' });
      const data = await res.json();
      if (!data.authenticated) { window.location.href = '/'; return; }
      currentUser = data.user;
      const isCrossCampus = data.user.plan === 'cross_campus';
      refreshBadges();
      const av = document.getElementById('headerAvatar');
      if (data.user.photo_url) {
        av.innerHTML = `<img src="${data.user.photo_url}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;position:absolute;inset:0;" />`;
      } else {
        av.textContent = (data.user.name || data.user.email || '?')[0].toUpperCase();
      }

      // Show campus label in header if viewing a different campus
      if (isCrossCampus && selectedUniId && selectedUniId !== data.user.university_id) {
        try {
          const unis = JSON.parse(sessionStorage.getItem('cc_universities') || '[]');
          const uni  = unis.find(u => u.id === selectedUniId);
          if (uni) {
            const lbl = document.getElementById('studyCampusLabel');
            lbl.textContent = uni.short_name;
            lbl.style.display = '';
          }
        } catch (e) {}
      }

      loadDepartments();
    })();

    // ── Tab switching (inner tabs: Professor Ratings / Study Groups) ──────────
    const innerTabs = document.querySelectorAll('.cc-inner-tab');
    const panels    = { ratings: document.getElementById('panel-ratings'), groups: document.getElementById('panel-groups') };
    innerTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        innerTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        Object.values(panels).forEach(p => p.classList.remove('active'));
        panels[tab.dataset.tab].classList.add('active');
      });
    });

    // ── View state: departments ↔ professors ──────────────────────────────────
    function showView(view) {
      document.getElementById('viewDepts').style.display = view === 'depts' ? '' : 'none';
      document.getElementById('viewProfs').style.display = view === 'profs' ? '' : 'none';
      document.getElementById('scrollArea').scrollTop = 0;
    }

    // ── Departments view ──────────────────────────────────────────────────────
    async function loadDepartments() {
      const list = document.getElementById('deptList');
      list.innerHTML = skeletons(3, 72);
      try {
        const uniQ = (selectedUniId && currentUser && selectedUniId !== currentUser.university_id) ? `?uniId=${selectedUniId}` : '';
        const res  = await fetch(`/api/professors/departments${uniQ}`, { credentials: 'include' });
        const data = await res.json();
        list.innerHTML = '';

        if (!data.length) {
          list.innerHTML = `<div style="padding:40px 0;text-align:center;color:var(--muted);font-size:14px;">No faculties found.</div>`;
          return;
        }

        data.forEach(dept => {
          const card = document.createElement('button');
          card.type      = 'button';
          card.className = 'cc-dept-card';
          const avgStr   = dept.avg_rating ? renderStarsHtml(dept.avg_rating, 13) + ` <span style="font-size:11px;font-weight:700;color:var(--accent);">${dept.avg_rating}</span>` : '';
          const meta     = [
            `${dept.professor_count} professor${dept.professor_count !== 1 ? 's' : ''}`,
            dept.review_count ? `${dept.review_count} review${dept.review_count !== 1 ? 's' : ''}` : 'No reviews yet',
          ].join(' · ');
          card.innerHTML = `
            <div class="cc-dept-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/></svg>
            </div>
            <div class="cc-dept-info">
              <div class="cc-dept-name">${escHtml(dept.name)}</div>
              <div class="cc-dept-meta">${meta}</div>
            </div>
            ${avgStr ? `<div style="display:flex;align-items:center;gap:3px;flex-shrink:0;">${avgStr}</div>` : ''}
          `;
          card.addEventListener('click', () => enterDept(dept));
          list.appendChild(card);
        });
      } catch (e) {
        list.innerHTML = `<div style="padding:32px 0;text-align:center;color:var(--muted);">Failed to load. Try refreshing.</div>`;
      }
    }

    // Enter a department — switch to professor list view
    function enterDept(dept) {
      selectedDept = dept;
      document.getElementById('deptTitle').textContent = dept.name;
      document.getElementById('profListTitle').textContent = `Professors in ${dept.name}`;
      document.getElementById('profSearchInput').value = '';
      showView('profs');
      loadProfessors();
    }

    // Back to departments
    document.getElementById('backToDeptsBtn').addEventListener('click', () => {
      selectedDept = null;
      showView('depts');
      loadDepartments();
    });

    // ── Professors view ───────────────────────────────────────────────────────
    let profSearchTimer;
    document.getElementById('profSearchInput').addEventListener('input', (e) => {
      clearTimeout(profSearchTimer);
      profSearchTimer = setTimeout(() => loadProfessors(e.target.value.trim()), 280);
    });

    async function loadProfessors(search = '') {
      const list = document.getElementById('profList');
      list.innerHTML = skeletons(3, 64);
      try {
        const params = new URLSearchParams();
        if (selectedDept) params.set('department_id', selectedDept.id);
        if (search)        params.set('search', search);
        const res  = await fetch(`/api/professors?${params}`, { credentials: 'include' });
        const data = await res.json();
        list.innerHTML = '';

        if (!data.length) {
          const msg = search ? 'No professors match your search.' : 'No professors in this department yet.';
          list.innerHTML = `<div style="padding:32px 0;text-align:center;color:var(--muted);font-size:14px;">${msg}</div>`;
          return;
        }

        data.forEach(p => {
          const card   = document.createElement('a');
          card.href    = `/professor.html?id=${p.id}`;
          card.className = 'cc-prof-card';
          const stars  = p.avg_rating ? renderStarsHtml(p.avg_rating, 12) : '';
          const rLabel = p.avg_rating
            ? `<span style="font-size:12px;font-weight:700;color:var(--accent);margin-left:2px;">${p.avg_rating}</span>`
            : `<span style="font-size:12px;color:var(--muted);">No reviews yet</span>`;
          card.innerHTML = `
            <div class="cc-prof-avatar">🎓</div>
            <div class="cc-prof-info">
              <div class="cc-prof-name">${escHtml(p.name)}</div>
              <div class="cc-prof-dept">${escHtml(p.department_name || '—')}</div>
            </div>
            <div style="text-align:right;flex-shrink:0;">
              <div style="display:flex;align-items:center;gap:2px;justify-content:flex-end;">${stars}${rLabel}</div>
              <div style="font-size:11px;color:var(--muted);margin-top:2px;">${p.review_count} review${p.review_count !== 1 ? 's' : ''}</div>
            </div>
          `;
          list.appendChild(card);
        });
      } catch (e) {
        list.innerHTML = `<div style="padding:32px 0;text-align:center;color:var(--muted);">Failed to load.</div>`;
      }
    }

    // Rate a professor button (only visible in dept view)
    document.getElementById('rateProfBtn').addEventListener('click', () => openSheet());

    // ── Rate a Professor sheet ────────────────────────────────────────────────
    let selectedProf   = null;
    let selectedRating = 0;

    function openSheet() {
      selectedProf   = null;
      selectedRating = 0;
      // Show department badge if we're inside a dept
      const badge = document.getElementById('sheetDeptBadge');
      const label = document.getElementById('sheetDeptLabel');
      if (selectedDept) {
        label.textContent = selectedDept.name;
        badge.style.display = '';
      } else {
        badge.style.display = 'none';
      }
      document.getElementById('sheetProfSearch').value = '';
      document.getElementById('sheetSearchResults').innerHTML = '';
      document.getElementById('reviewComment').value   = '';
      document.getElementById('reviewCourse').value    = '';
      document.getElementById('reviewGrade').value     = '';
      document.getElementById('commentCount').textContent = '0';
      document.getElementById('reviewError').classList.remove('show');
      updateStars(0);
      showStep('search');
      document.getElementById('rateSheet').classList.add('open');
    }

    document.getElementById('rateSheet').addEventListener('click', (e) => {
      if (e.target === document.getElementById('rateSheet')) closeSheet();
    });
    function closeSheet() { document.getElementById('rateSheet').classList.remove('open'); }

    function showStep(step) {
      document.getElementById('stepSearch').style.display = step === 'search' ? '' : 'none';
      document.getElementById('stepReview').style.display = step === 'review' ? '' : 'none';
      if (step === 'review' && selectedProf) {
        const deptSuffix = selectedProf.department_name ? ` · ${selectedProf.department_name}` : '';
        document.getElementById('selectedProfBanner').textContent = selectedProf.name + deptSuffix;
      }
    }

    // Live professor search inside sheet — scoped to current department
    let sheetTimer;
    document.getElementById('sheetProfSearch').addEventListener('input', (e) => {
      // Reset on every keystroke so a stale selection is never submitted
      selectedProf = null;
      clearTimeout(sheetTimer);
      sheetTimer = setTimeout(() => sheetSearchProfs(e.target.value.trim()), 280);
    });

    async function sheetSearchProfs(q) {
      const results = document.getElementById('sheetSearchResults');
      if (!q) { results.innerHTML = ''; return; }
      try {
        const params = new URLSearchParams({ search: q });
        if (selectedDept) params.set('department_id', selectedDept.id);
        const res  = await fetch(`/api/professors?${params}`, { credentials: 'include' });
        const data = await res.json();
        results.innerHTML = '';

        // Existing matches
        data.slice(0, 5).forEach(p => {
          const btn = document.createElement('button');
          btn.type      = 'button';
          btn.className = 'cc-prof-card';
          btn.style.cssText = 'width:100%;text-align:left;cursor:pointer;';
          btn.innerHTML = `
            <div class="cc-prof-avatar" style="width:36px;height:36px;font-size:14px;">🎓</div>
            <div class="cc-prof-info">
              <div class="cc-prof-name">${escHtml(p.name)}</div>
              <div class="cc-prof-dept">${escHtml(p.department_name || '—')}</div>
            </div>`;
          btn.addEventListener('click', () => {
            selectedProf = p;
            results.innerHTML = '';
            showStep('review');
          });
          results.appendChild(btn);
        });

        // "Add new" option if no exact name match
        if (!data.some(p => p.name.toLowerCase() === q.toLowerCase())) {
          const addBtn = document.createElement('button');
          addBtn.type      = 'button';
          addBtn.className = 'cc-prof-card';
          addBtn.style.cssText = 'width:100%;text-align:left;cursor:pointer;border-color:var(--accent);';
          addBtn.innerHTML = `
            <div class="cc-prof-avatar" style="width:36px;height:36px;font-size:14px;border-color:var(--accent);">＋</div>
            <div class="cc-prof-info">
              <div class="cc-prof-name" style="color:var(--accent);">Add "${escHtml(q)}"</div>
              <div class="cc-prof-dept">${selectedDept ? `in ${escHtml(selectedDept.name)}` : 'New professor'}</div>
            </div>`;
          addBtn.addEventListener('click', () => {
            selectedProf = { name: q, department_id: selectedDept?.id, department_name: selectedDept?.name, _new: true };
            results.innerHTML = '';
            showStep('review');
          });
          results.appendChild(addBtn);
        }
      } catch (e) {}
    }

    // Continue button — always derive the professor from the current typed value.
    // If the user explicitly clicked a search result, selectedProf.name will match;
    // otherwise (or if they edited the text after selecting), build a fresh object.
    document.getElementById('sheetNextBtn').addEventListener('click', () => {
      const name = document.getElementById('sheetProfSearch').value.trim();
      if (!name) { showToast('Enter a professor name', 'error'); return; }
      if (!selectedProf || selectedProf.name.toLowerCase() !== name.toLowerCase()) {
        selectedProf = { name, department_id: selectedDept?.id, department_name: selectedDept?.name, _new: true };
      }
      showStep('review');
    });

    document.getElementById('reviewBackBtn').addEventListener('click', () => {
      selectedProf = null;
      showStep('search');
    });

    // Star picker
    const stars = document.querySelectorAll('#starPicker .cc-star');
    const LABELS = ['', 'Poor', 'Fair', 'Good', 'Very Good', 'Excellent'];
    stars.forEach(star => {
      star.addEventListener('mouseenter', () => updateStars(parseInt(star.dataset.v), true));
      star.addEventListener('mouseleave', () => updateStars(selectedRating));
      star.addEventListener('click', () => { selectedRating = parseInt(star.dataset.v); updateStars(selectedRating); });
    });
    function updateStars(value, hover = false) {
      stars.forEach(s => {
        const v  = parseInt(s.dataset.v);
        const on = hover ? v <= value : v <= selectedRating;
        s.classList.toggle('filled',  !hover && v <= selectedRating);
        s.classList.toggle('hovered',  hover && v <= value);
        s.setAttribute('fill', on ? 'currentColor' : 'none');
      });
      document.getElementById('ratingLabel').textContent = hover ? LABELS[value] : (selectedRating ? LABELS[selectedRating] : '');
    }

    document.getElementById('reviewComment').addEventListener('input', (e) => {
      document.getElementById('commentCount').textContent = e.target.value.length;
    });

    // Submit review — single atomic endpoint: find/create professor + insert review
    document.getElementById('submitReviewBtn').addEventListener('click', async () => {
      const course  = document.getElementById('reviewCourse').value.trim().toUpperCase();
      const comment = document.getElementById('reviewComment').value.trim();
      const grade   = document.getElementById('reviewGrade').value;
      const errEl   = document.getElementById('reviewError');
      errEl.classList.remove('show');

      if (!selectedProf)   { errEl.textContent = 'Please select a professor.';    errEl.classList.add('show'); return; }
      if (!selectedDept)   { errEl.textContent = 'Please select a faculty first.'; errEl.classList.add('show'); return; }
      if (!course)         { errEl.textContent = 'Course code is required.';       errEl.classList.add('show'); return; }
      if (!selectedRating) { errEl.textContent = 'Please choose a star rating.';   errEl.classList.add('show'); return; }

      document.getElementById('submitReviewBtn').disabled = true;
      document.getElementById('submitReviewText').textContent = 'Submitting…';

      try {
        const res  = await fetch('/api/professors/rate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            professor_name:  selectedProf.name,
            department_id:   selectedDept.id,
            course_code:     course,
            rating:          selectedRating,
            comment:         comment || null,
            grade_received:  grade   || null,
          }),
        });
        const data = await res.json();

        if (res.ok && data.success) {
          closeSheet();
          // Await the professor list so the page is repainted before the toast appears
          await loadProfessors(document.getElementById('profSearchInput').value.trim());
          showToast('Review submitted!', 'success');
          // Fire-and-forget faculty summary refresh (background — user is in prof view)
          loadDepartments();
        } else {
          errEl.textContent = data.message || 'Failed to submit review.';
          errEl.classList.add('show');
        }
      } catch (e) {
        errEl.textContent = 'Network error. Try again.';
        errEl.classList.add('show');
      } finally {
        document.getElementById('submitReviewBtn').disabled = false;
        document.getElementById('submitReviewText').textContent = 'Submit review';
      }
    });

    // ── Helpers ───────────────────────────────────────────────────────────────
    function renderStarsHtml(avg, size = 12) {
      const rounded = Math.round(avg);
      let html = '';
      for (let i = 1; i <= 5; i++) {
        html += `<svg viewBox="0 0 24 24" fill="${i <= rounded ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" style="width:${size}px;height:${size}px;color:var(--accent);flex-shrink:0;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
      }
      return html;
    }

    function skeletons(n, h = 64) {
      return Array.from({ length: n }, () =>
        `<div class="cc-skeleton" style="height:${h}px;border-radius:16px;"></div>`
      ).join('');
    }

    function showToast(msg, type = '') {
      let t = document.getElementById('_toast');
      if (!t) { t = document.createElement('div'); t.id = '_toast'; t.className = 'cc-toast no-tab'; document.body.appendChild(t); }
      t.textContent = msg;
      t.className = 'cc-toast no-tab' + (type ? ' ' + type : '');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    function escHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
