<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set your password — CampusConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="cc-page">
    <div class="cc-page-inner no-tab">
      <div class="cc-auth-page animate-slide-up">

        <div class="cc-auth-logo">
          <a href="/" class="cc-header-logo">
            <div class="cc-logo-mark">CC</div>
            <span>CampusConnect</span>
          </a>
        </div>

        <div class="cc-progress-dots">
          <div class="cc-dot done"></div>
          <div class="cc-dot done"></div>
          <div class="cc-dot active"></div>
        </div>

        <div style="margin-bottom:28px;margin-top:20px;">
          <h1 class="cc-auth-title">Create a password</h1>
          <p class="cc-auth-subtitle">This secures your account. You'll need it every time you log in.</p>
        </div>

        <div class="cc-error-msg" id="errorMsg"></div>

        <div class="cc-field">
          <label class="cc-label" for="pwInput">Password <span style="color:var(--muted);font-size:12px;">(min 8 characters)</span></label>
          <div style="position:relative;">
            <input type="password" class="cc-input" id="pwInput" placeholder="Create a strong password"
              autocomplete="new-password" style="padding-right:44px;" />
            <button type="button" id="togglePw1" aria-label="Show password"
              style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <!-- Strength bar -->
          <div style="margin-top:8px;height:4px;border-radius:2px;background:var(--surface2);overflow:hidden;">
            <div id="strengthBar" style="height:100%;width:0%;border-radius:2px;transition:width 0.2s,background 0.2s;"></div>
          </div>
          <div id="strengthLabel" style="font-size:11px;color:var(--muted);margin-top:4px;height:14px;"></div>
        </div>

        <div class="cc-field">
          <label class="cc-label" for="pwConfirm">Confirm Password</label>
          <div style="position:relative;">
            <input type="password" class="cc-input" id="pwConfirm" placeholder="Re-enter your password"
              autocomplete="new-password" style="padding-right:44px;" />
            <button type="button" id="togglePw2" aria-label="Show confirm password"
              style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button class="cc-btn" id="setBtn" disabled>
          <span id="setBtnText">Set password &amp; continue</span>
        </button>

      </div>
    </div>
  </div>

  <script>
    const email     = sessionStorage.getItem('cc_email') || '';
    if (!email) window.location.href = '/signup.html';

    const pwInput   = document.getElementById('pwInput');
    const pwConfirm = document.getElementById('pwConfirm');
    const setBtn    = document.getElementById('setBtn');
    const errorMsg  = document.getElementById('errorMsg');

    // Show/hide toggles
    document.getElementById('togglePw1').addEventListener('click', () => {
      pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
    });
    document.getElementById('togglePw2').addEventListener('click', () => {
      pwConfirm.type = pwConfirm.type === 'password' ? 'text' : 'password';
    });

    const LEVELS = [
      { label: '',          color: '',          min: 0  },
      { label: 'Weak',      color: '#ef4444',   min: 1  },
      { label: 'Fair',      color: '#f59e0b',   min: 2  },
      { label: 'Good',      color: '#3b82f6',   min: 3  },
      { label: 'Strong',    color: '#22c55e',   min: 4  },
    ];

    function passwordStrength(pw) {
      let score = 0;
      if (pw.length >= 8)   score++;
      if (pw.length >= 12)  score++;
      if (/[A-Z]/.test(pw)) score++;
      if (/[0-9]/.test(pw)) score++;
      if (/[^A-Za-z0-9]/.test(pw)) score++;
      return Math.min(score, 4);
    }

    function validate() {
      const pw  = pwInput.value;
      const ok  = pw.length >= 8 && pw === pwConfirm.value;
      setBtn.disabled = !ok;

      const s = passwordStrength(pw);
      const bar   = document.getElementById('strengthBar');
      const label = document.getElementById('strengthLabel');
      if (pw.length === 0) { bar.style.width = '0%'; label.textContent = ''; return; }
      bar.style.width      = (s * 25) + '%';
      bar.style.background = LEVELS[s].color;
      label.textContent    = LEVELS[s].label;
      label.style.color    = LEVELS[s].color;
    }

    [pwInput, pwConfirm].forEach(el => el.addEventListener('input', validate));
    pwConfirm.addEventListener('keydown', (e) => { if (e.key === 'Enter') setBtn.click(); });

    setBtn.addEventListener('click', async () => {
      const password = pwInput.value;
      errorMsg.classList.remove('show');
      setBtn.disabled = true;
      document.getElementById('setBtnText').textContent = 'Saving…';

      try {
        const res  = await fetch('/api/auth/set-password', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (res.ok && data.success) {
          sessionStorage.removeItem('cc_email');
          sessionStorage.removeItem('cc_uni_id');
          window.location.href = data.redirect || '/profile-setup.html';
        } else {
          errorMsg.textContent = data.message || 'Failed to set password.';
          errorMsg.classList.add('show');
        }
      } catch (e) {
        errorMsg.textContent = 'Network error. Please try again.';
        errorMsg.classList.add('show');
      } finally {
        setBtn.disabled = false;
        document.getElementById('setBtnText').textContent = 'Set password & continue';
        validate();
      }
    });
  </script>
</body>
</html>
