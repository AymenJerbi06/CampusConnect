<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — CampusConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="cc-page">
    <div class="cc-page-inner no-tab">
      <div class="cc-auth-page animate-slide-up">

        <div class="cc-auth-logo">
          <a href="/" class="cc-header-logo">
            <div class="cc-logo-mark">CC</div>
            <span>CampusConnect</span>
          </a>
        </div>

        <div class="cc-auth-icon-wrap">
          <div class="cc-auth-icon" style="background:rgba(200,240,78,0.12);">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <h1 class="cc-auth-title">Reset your password</h1>
          <p class="cc-auth-subtitle">Enter your university email and we'll send you a reset code.</p>
        </div>

        <div class="cc-error-msg" id="errorMsg"></div>
        <div class="cc-success-msg" id="successMsg" style="display:none;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:#22c55e;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;text-align:center;margin-bottom:12px;"></div>

        <div class="cc-field" id="emailField">
          <label class="cc-label" for="emailInput">University Email</label>
          <input
            type="email"
            class="cc-input"
            id="emailInput"
            placeholder="you@sfu.ca"
            autocomplete="username"
            autocapitalize="none"
          />
        </div>

        <button class="cc-btn" id="sendBtn" disabled>
          <span id="sendBtnText">Send reset code</span>
        </button>

        <div class="cc-auth-footer">
          <a href="/login.html">&larr; Back to login</a>
        </div>

      </div>
    </div>
  </div>

  <script>
    const emailInput = document.getElementById('emailInput');
    const sendBtn    = document.getElementById('sendBtn');
    const errorMsg   = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    emailInput.addEventListener('input', () => {
      sendBtn.disabled = !emailInput.value.trim().includes('@');
    });
    emailInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendBtn.click(); });

    sendBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim().toLowerCase();
      errorMsg.classList.remove('show');
      sendBtn.disabled = true;
      document.getElementById('sendBtnText').textContent = 'Sending…';

      try {
        const res  = await fetch('/api/auth/forgot-password', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email }),
        });
        const data = await res.json();

        // Always show success (avoid email enumeration)
        sessionStorage.setItem('cc_email',      email);
        sessionStorage.setItem('cc_flow',       'reset');
        successMsg.textContent = `If ${email} has an account, a reset code was sent.`;
        successMsg.style.display = '';
        document.getElementById('emailField').style.display = 'none';
        sendBtn.style.display = 'none';

        setTimeout(() => { window.location.href = '/reset-password.html'; }, 2000);
      } catch (e) {
        errorMsg.textContent = 'Network error. Please try again.';
        errorMsg.classList.add('show');
        sendBtn.disabled = false;
        document.getElementById('sendBtnText').textContent = 'Send reset code';
      }
    });
  </script>
</body>
</html>
