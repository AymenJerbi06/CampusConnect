<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Visitors — CampusConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="cc-page">

    <!-- Header -->
    <header class="cc-header">
      <button class="cc-back-btn" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Back
      </button>
      <div class="cc-header-title">Profile Visitors</div>
      <div class="cc-header-actions">
        <a href="/my-profile.html" style="display:flex;align-items:center;">
          <div class="cc-avatar" id="headerAvatar" style="width:32px;height:32px;font-size:13px;border-color:var(--border);">?</div>
        </a>
      </div>
    </header>

    <div class="cc-page-inner" style="overflow-y:auto; padding-bottom:80px;" id="pageContent">
      <div style="padding:32px;text-align:center;color:var(--muted);">Loading…</div>
    </div>

    <!-- Bottom Tab Bar -->
    <nav class="cc-tab-bar">
      <a href="/home.html" class="cc-tab-item" aria-label="Explore">
        <span class="cc-nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <span>Explore</span>
      </a>
      <a href="/inbox.html" class="cc-tab-item" aria-label="Friends">
        <span class="cc-nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="23" y1="11" x2="17" y2="11"/><line x1="20" y1="8" x2="20" y2="14"/></svg>
          <span class="cc-nav-badge" id="friendsBadge" style="display:none;"></span>
        </span>
        <span>Friends</span>
      </a>
      <a href="/study.html" class="cc-tab-item" aria-label="Study">
        <span class="cc-nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </span>
        <span>Study</span>
      </a>
      <a href="/messages.html" class="cc-tab-item" aria-label="Messages">
        <span class="cc-nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="cc-nav-badge" id="messagesBadge" style="display:none;"></span>
        </span>
        <span>Messages</span>
      </a>
      <a href="/my-profile.html" class="cc-tab-item cc-tab-item-active" aria-label="Profile">
        <span class="cc-nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/presence.js"></script>
  <script src="/js/badges.js"></script>
  <script>
    (async () => {
      const res  = await fetch('/api/auth/me', { credentials: 'include' });
      const data = await res.json();
      if (!data.authenticated) { window.location.href = '/'; return; }

      refreshBadges();
      const av = document.getElementById('headerAvatar');
      if (data.user.photo_url) {
        av.innerHTML = `<img src="${data.user.photo_url}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;position:absolute;inset:0;" />`;
      } else {
        av.textContent = (data.user.name || data.user.email || '?')[0].toUpperCase();
      }

      loadVisitors();
    })();

    async function loadVisitors() {
      const content = document.getElementById('pageContent');
      try {
        const res  = await fetch('/api/visits', { credentials: 'include' });
        const data = await res.json();
        if (!res.ok) { content.innerHTML = `<div style="padding:32px;text-align:center;color:var(--muted);">${data.message || 'Failed to load.'}</div>`; return; }

        if (!data.length) {
          content.innerHTML = `
            <div style="padding:60px 24px;text-align:center;color:var(--muted);">
              <div style="font-size:40px;margin-bottom:12px;">👀</div>
              <p style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px;">No visitors yet</p>
              <p style="font-size:13px;">When other students view your profile, they'll appear here.</p>
            </div>`;
          return;
        }

        content.innerHTML = `
          <p class="cc-section-title" style="margin-top:16px;">People who viewed your profile</p>
          <div id="visitorsList" style="padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;"></div>
        `;

        const list = document.getElementById('visitorsList');
        data.forEach(v => {
          const card = document.createElement('a');
          card.href      = `/profile.html?id=${v.id}`;
          card.className = 'cc-card';
          card.style.cssText = 'display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;';

          const initial  = (v.name || '?')[0].toUpperCase();
          const photoHtml = v.photo_url
            ? `<img src="${v.photo_url}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" />`
            : '';

          const timeAgo = formatTime(v.last_visit);
          const countStr = v.visit_count > 1 ? ` · ${v.visit_count} visits` : '';

          const uniBadge = v.university
            ? `<span style="font-size:10px;font-weight:700;color:var(--accent);background:rgba(200,168,64,.12);border:1px solid rgba(200,168,64,.25);border-radius:6px;padding:2px 6px;margin-left:6px;">${v.university}</span>`
            : '';
          card.innerHTML = `
            <div class="cc-avatar" style="position:relative;flex-shrink:0;">${initial}${photoHtml}</div>
            <div style="flex:1;min-width:0;">
              <div style="font-weight:700;font-size:14px;color:var(--text);display:flex;align-items:center;flex-wrap:wrap;gap:4px;">${v.name || 'Student'}${uniBadge}</div>
              <div style="font-size:12px;color:var(--muted);margin-top:2px;">${[v.major, v.year].filter(Boolean).join(' · ')}</div>
            </div>
            <div style="font-size:11px;color:var(--muted);text-align:right;flex-shrink:0;">${timeAgo}${countStr}</div>
          `;
          list.appendChild(card);
        });
      } catch (e) {
        content.innerHTML = '<div style="padding:32px;text-align:center;color:var(--muted);">Failed to load visitors.</div>';
      }
    }

    function formatTime(isoStr) {
      const diff = Date.now() - new Date(isoStr).getTime();
      const m = Math.floor(diff / 60000);
      if (m < 1)  return 'just now';
      if (m < 60) return `${m}m ago`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}h ago`;
      const d = Math.floor(h / 24);
      if (d < 7)  return `${d}d ago`;
      return new Date(isoStr).toLocaleDateString();
    }
  </script>
</body>
</html>
