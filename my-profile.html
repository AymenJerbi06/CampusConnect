<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — CampusConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="cc-page">

    <!-- Header -->
    <header class="cc-header">
      <div class="cc-header-logo">
        <div class="cc-logo-mark">CC</div>
        <span>My Profile</span>
      </div>
      <div class="cc-header-actions" id="headerActions"></div>
    </header>

    <div class="cc-page-inner" style="overflow-y:auto; padding-bottom:80px;" id="pageContent">
      <div style="padding:32px;text-align:center;color:var(--muted);">Loading…</div>
    </div>

    <!-- Toast -->
    <div class="cc-toast" id="toast"></div>

    <!-- Bottom Tab Bar -->
    <nav class="cc-tab-bar">
      <a href="/home.html" class="cc-tab-item" aria-label="Explore">
        <span class="cc-nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <span>Explore</span>
      </a>
      <a href="/inbox.html" class="cc-tab-item" aria-label="Friends">
        <span class="cc-nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="23" y1="11" x2="17" y2="11"/><line x1="20" y1="8" x2="20" y2="14"/></svg>
          <span class="cc-nav-badge" id="friendsBadge" style="display:none;"></span>
        </span>
        <span>Friends</span>
      </a>
      <a href="/study.html" class="cc-tab-item" aria-label="Study">
        <span class="cc-nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </span>
        <span>Study</span>
      </a>
      <a href="/messages.html" class="cc-tab-item" aria-label="Messages">
        <span class="cc-nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="cc-nav-badge" id="messagesBadge" style="display:none;"></span>
        </span>
        <span>Messages</span>
      </a>
      <a href="/my-profile.html" class="cc-tab-item active" aria-label="Profile">
        <span class="cc-nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/presence.js"></script>
  <script src="/js/badges.js"></script>
  <script>
    // Auth guard
    (async () => {
      const res  = await fetch('/api/auth/me', { credentials: 'include' });
      const data = await res.json();
      if (!data.authenticated) { window.location.href = '/'; return; }
      refreshBadges();
    })();

    const content = document.getElementById('pageContent');

    async function loadProfile() {
      try {
        const res  = await fetch('/api/users/me', { credentials: 'include' });
        if (!res.ok) { window.location.href = '/'; return; }
        const user = await res.json();
        renderProfile(user);
      } catch (e) {
        content.innerHTML = '<div style="padding:32px;text-align:center;color:var(--muted);">Failed to load profile.</div>';
      }
    }

    function formatLastSeen(ts) {
      if (!ts) return '';
      const diff = Date.now() - new Date(ts).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1)  return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24)  return `${hrs}h ago`;
      const days = Math.floor(hrs / 24);
      if (days === 1) return 'yesterday';
      if (days < 7)  return `${days} days ago`;
      return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function renderProfile(user) {
      const isPremium = user.plan === 'premium';
      const initial   = (user.name || user.email || '?')[0].toUpperCase();
      const photoHtml = user.photo_url
        ? `<img src="${user.photo_url}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" />`
        : '';
      // Own presence: always visible on your own profile
      const ownDot   = (user.is_online !== null && user.is_online !== undefined)
        ? `<span class="cc-presence-dot-lg ${user.is_online ? 'online' : 'offline'}" id="myPresenceDot"></span>`
        : '';
      const ownLabel = (user.is_online !== null && user.is_online !== undefined)
        ? `<p class="cc-presence-label${user.is_online ? ' online' : ''}" id="myPresenceLabel">${user.is_online ? 'Online now' : (user.last_seen ? 'Last active ' + formatLastSeen(user.last_seen) : '')}</p>`
        : '';

      const communityBadges = (user.communities || []).map(c =>
        `<span class="cc-interest-tag">
          <span>${c.flag_emoji}</span>
          <span>${c.name}</span>
        </span>`
      ).join('');

      const courseTags = (user.courses || []).map(c =>
        `<span class="cc-interest-tag purple">${c.code}</span>`
      ).join('');

      const interestTags = [
        user.major  ? `<span class="cc-interest-tag accent">${user.major}</span>` : '',
        user.year   ? `<span class="cc-interest-tag">${user.year}</span>` : '',
        user.gender ? `<span class="cc-interest-tag">${user.gender}</span>` : '',
      ].filter(Boolean).join('');

      const igBtn = user.instagram ? `
        <a href="https://instagram.com/${user.instagram}" target="_blank" rel="noopener" class="cc-social-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
          </svg>
          @${user.instagram}
        </a>` : '';

      const liBtn = user.linkedin ? `
        <a href="${user.linkedin}" target="_blank" rel="noopener" class="cc-social-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>
          </svg>
          LinkedIn Profile
        </a>` : '';

      const emailLine = user.email
        ? `<p style="font-size:13px;color:var(--muted);margin-top:2px;">${user.email}</p>` : '';

      const planBadge = isPremium
        ? `<div style="display:inline-flex;align-items:center;gap:6px;background:rgba(200,240,78,0.12);border:1px solid rgba(200,240,78,0.3);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--accent);margin-top:8px;">⚡ Premium</div>`
        : `<div style="display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 4px 4px 12px;font-size:12px;font-weight:600;color:var(--muted);margin-top:8px;">
            Free Plan
            <a href="/upgrade.html" style="background:var(--accent);color:#0a0a0f;font-size:11px;font-weight:800;padding:3px 10px;border-radius:14px;text-decoration:none;white-space:nowrap;">⚡ Upgrade</a>
          </div>`;

      content.innerHTML = `
        <!-- Profile Hero -->
        <div class="cc-profile-hero animate-slide-up">
          <div class="cc-avatar-wrap">
            <div class="cc-avatar cc-avatar-xl" style="border-color:var(--accent);">${initial}${photoHtml}</div>
            ${ownDot}
          </div>
          <h1 class="cc-profile-name">${user.name || 'Complete your profile'}</h1>
          ${emailLine}
          <p class="cc-profile-meta">${[user.major, user.year].filter(Boolean).join(' · ') || 'No major set yet'}</p>
          ${planBadge}
          ${ownLabel}
        </div>

        <!-- Action buttons -->
        <div style="padding: 0 16px 16px; display:flex; flex-direction:column; gap:10px;">
          <a href="/profile-setup.html" class="cc-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;stroke:#0a0a0f;">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            Edit profile
          </a>
          <button class="cc-btn cc-btn-danger" id="logoutBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;stroke:#fff;">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span id="logoutText">Log out</span>
          </button>
        </div>

        <!-- Interest Tags -->
        ${interestTags ? `
        <div class="cc-divider"></div>
        <div class="cc-section-body">
          <div class="cc-tags-row">${interestTags}</div>
        </div>` : ''}

        <!-- Bio -->
        ${user.bio ? `
        <div class="cc-divider"></div>
        <p class="cc-profile-bio">${escHtml(user.bio)}</p>` : ''}

        <!-- Communities -->
        ${communityBadges ? `
        <div class="cc-divider"></div>
        <p class="cc-section-title">Cultural Communities</p>
        <div class="cc-section-body">
          <div class="cc-tags-row">${communityBadges}</div>
        </div>` : ''}

        <!-- Social links -->
        ${(igBtn || liBtn) ? `
        <div class="cc-divider"></div>
        <p class="cc-section-title">Connect</p>
        <div class="cc-section-body">
          <div class="cc-social-row">
            ${igBtn}
            ${liBtn}
          </div>
        </div>` : ''}

        <!-- Courses -->
        ${courseTags ? `
        <div class="cc-divider"></div>
        <p class="cc-section-title">My Courses</p>
        <div class="cc-section-body">
          <div class="cc-tags-row">${courseTags}</div>
        </div>` : ''}

        <!-- Privacy note -->
        ${(user.hide_community || user.browse_privately) ? `
        <div class="cc-divider"></div>
        <div style="padding:12px 16px;display:flex;flex-direction:column;gap:8px;">
          ${user.hide_community ? `
          <span class="cc-interest-tag" style="font-size:11px;color:var(--muted);">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            Community hidden from your public profile
          </span>` : ''}
          ${user.browse_privately ? `
          <span class="cc-interest-tag" style="font-size:11px;color:var(--muted);">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            Browsing privately — profile visits not recorded
          </span>` : ''}
        </div>` : ''}

        <div style="height:16px;"></div>
      `;

      // Inject visitors button into header for premium users
      const headerActions = document.getElementById('headerActions');
      if (isPremium) {
        headerActions.innerHTML = `
          <a href="/visitors.html" style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text);text-decoration:none;padding:6px 10px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            Visitors
          </a>`;
      }

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        document.getElementById('logoutText').textContent = 'Logging out…';
        // Signal the backend before clearing the cookie so it can broadcast
        // the offline event while the socket is still authenticated.
        if (window.ccPresence) await window.ccPresence.logout();
        try {
          await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
        } catch (e) {}
        window.location.href = '/';
      });
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>');
    }

    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'cc-toast' + (type ? ' ' + type : '');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    loadProfile();

    // Real-time: own presence dot + label update (e.g. if session goes idle then reconnects)
    try {
      const socket = io({ withCredentials: true });
      socket.on('presence:change', ({ userId, online, last_seen }) => {
        const dot = document.getElementById('myPresenceDot');
        const lbl = document.getElementById('myPresenceLabel');
        if (!dot && !lbl) return;
        if (dot) dot.className = `cc-presence-dot-lg ${online ? 'online' : 'offline'}`;
        if (lbl) {
          lbl.textContent = online ? 'Online now' : (last_seen ? 'Last active ' + formatLastSeen(last_seen) : '');
          lbl.className   = `cc-presence-label${online ? ' online' : ''}`;
        }
      });
    } catch (e) {}
  </script>
</body>
</html>
