  <mask id="imagine-text-gaps-tgs9ay" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="500" height="530.63" fill="white"/><rect x="36" y="331.40521240234375" width="379.5043640136719" height="125.22440338134766" fill="black" rx="2"/><rect x="76" y="397.4051818847656" width="392.86260986328125" height="125.22440338134766" fill="black" rx="2"/></mask></defs>

  <!-- Card background -->
  <rect x="0" y="0" width="500" height="500" rx="80" fill="#1a1d2e" style="fill:rgb(26, 29, 46);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

